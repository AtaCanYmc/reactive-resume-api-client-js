name: Feature Request
description: Suggest an idea or feature for reactive-resume-api-client-js
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature! Please check existing issues and PRs first to avoid duplicates.

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear description of what the problem is.
      placeholder: I'm always frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Describe the Solution You'd Like
      description: A clear description of what you want to happen or what API method you propose.
      placeholder: It would be great if client.resumes had a method to...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Describe Alternatives Considered
      description: Any alternative solutions or features you've considered.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any other context, Reactive Resume v4 API references, or screenshots about the feature request here.
    validations:
      required: false
